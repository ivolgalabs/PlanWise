name: CI

# Shared template: `checks/ci.yml` of your own rules store (Rules_Zai/ for ZCode,
# Rules_Antigravity/ for Antigravity) → <project>/.github/workflows/ci.yml
# Gate: fmt → clippy → tests → cargo audit/deny → npm test/audit +
#       hygiene (gitleaks / actionlint / zizmor — job "hygiene").
# Blocks only real defects: vulnerabilities, GPL, build errors.
# Unmaintained/unknown/duplicate versions — warnings, not a CI failure.

on:
  push:
    # every branch: a development line on a renamed branch produced zero CI runs for two months (ComiFlow, 22.09.2026)
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # core_base — the shared base (a path dependency outside the repository).
      # The path is computed from Cargo.toml so the template needs no edits.
      # Source: the core_base/ directory in the repository, otherwise the
      # repository variable CORE_BASE_REPO (Settings → Secrets and variables → Actions → Variables).
      - name: Подготовка core_base
        working-directory: .
        env:
          CORE_BASE_REPO: ${{ vars.CORE_BASE_REPO }}
        run: |
          REL=$(python3 -c "
          import re
          t = open('src-tauri/Cargo.toml').read()
          m = re.search(r'core_base\s*=\s*\{[^}]*path\s*=\s*\"([^\"]+)\"', t)
          print(m.group(1) if m else '')
          ")
          if [ -z "$REL" ]; then
            echo "core_base не найден в src-tauri/Cargo.toml — проект его не использует"
            exit 0
          fi
          TARGET=$(python3 -c "import os,sys;print(os.path.normpath(os.path.join('src-tauri',sys.argv[1])))" "$REL")
          echo "Ожидаемый путь core_base: $TARGET"
          mkdir -p "$TARGET"
          if [ -d core_base ]; then
            cp -r core_base/. "$TARGET"/
          elif [ -n "$CORE_BASE_REPO" ]; then
            git clone --depth 1 "$CORE_BASE_REPO" "$TARGET"
          else
            echo "::error::core_base недоступен. Задайте переменную репозитория CORE_BASE_REPO (URL git-репозитория с core_base) или закоммитьте каталог core_base/ в корень."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri

      - name: Формат (cargo fmt --check)
        run: cargo fmt --all --check

      - name: Clippy (0 предупреждений)
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты
        run: cargo test

      # TS bindings are generated from Rust (ts-rs). The step catches "changed a type
      # in Rust, forgot to regenerate": if the working tree changed after generation,
      # the committed bindings have drifted from Rust. Projects without src/bindings
      # skip this step.
      - name: Привязки TypeScript (ts-rs)
        working-directory: .
        if: ${{ hashFiles('src/bindings/**.ts') != '' }}
        run: |
          (cd src-tauri && cargo test export_bindings)
          # status, not diff: diff does not see NEW binding files (a new type in Rust).
          if [ -n "$(git status --porcelain -- src/bindings)" ]; then
            echo "::error::Привязки TypeScript разошлись с Rust. Выполните: cd src-tauri && cargo test export_bindings — и закоммитьте src/bindings/ (и правки фронтенда под новый тип)."
            git status --porcelain -- src/bindings
            exit 1
          fi

      # Update to the latest patch versions within semver — this way a vulnerability
      # in a transitive dependency is visible immediately, not after a manual update.
      - name: Аудит зависимостей (RustSec)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet
          cargo audit

      - name: Лицензии и дубли (cargo-deny)
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --quiet
          cargo deny --config deny.toml check
        if: ${{ hashFiles('src-tauri/deny.toml') != '' }}

  frontend:
    name: Frontend (tests + build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Проект без фронтенда — пропуск
        id: guard
        run: |
          if [ -f package.json ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.guard.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        if: steps.guard.outputs.ok == '1'
        run: npm ci

      - name: Типы (tsc --noEmit)
        if: steps.guard.outputs.ok == '1'
        run: npm run lint --if-present

      - name: Юнит-тесты
        if: steps.guard.outputs.ok == '1'
        run: |
          if [ -z "$(node -p "try { require('./package.json').scripts?.test || '' } catch(e) { '' }" 2>/dev/null)" ]; then
            if find src tests -type f \( -name "*.test.*" -o -name "*.spec.*" \) 2>/dev/null | grep -q .; then
              echo "::error::Найдены файлы тестов (*.test.*, *.spec.*), но в package.json не объявлен скрипт 'test'. Добавьте 'test' скрипт (напр. 'vitest run')."
              exit 1
            fi
          fi
          npm test --if-present

      - name: Сборка
        if: steps.guard.outputs.ok == '1'
        run: npm run build --if-present

      - name: Аудит зависимостей (npm)
        if: steps.guard.outputs.ok == '1'
        run: npm audit --omit=dev --audit-level=high

  # Hygiene: secrets across the full git history + workflow lint. Runs on every push.
  # zizmor is advisory (continue-on-error) until the findings already accumulated in
  # the projects are fixed — then remove that flag.
  hygiene:
    name: Hygiene (gitleaks + actionlint + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # gitleaks scans the whole history, not the shallow clone
          persist-credentials: false

      - name: Секреты (gitleaks)
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh \
            | bash -s -- -b /usr/local/bin v8.30.1
          gitleaks detect --redact

      - name: Линт воркфлоу (actionlint)
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # -shellcheck=: structural gate only (shellcheck is not installed on the runner anyway)
          ./actionlint -color -shellcheck=

      - name: Гигиена воркфлоу (zizmor)
        run: |
          pipx install "zizmor==1.30.1"
          ~/.local/bin/zizmor .github/workflows
