<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const VEC = {
  visa: { i: '🎓', n: 'ВНЖ / Учёба', c: 'var(--chart-1)' },
  cash: { i: '💰', n: 'Кэш / Релиз', c: 'var(--chart-2)' },
  life: { i: '🌿', n: 'Здоровье / Быт', c: 'var(--chart-3)' },
  opt: { i: '⚙️', n: 'Оптимизация', c: 'var(--warning)' },
};
const WT = { H: { n: 'Heavy', pts: 3 }, M: { n: 'Medium', pts: 2 }, S: { n: 'Micro', pts: 1 } };
// shortcut: budget and caps are constants; the real app learns them from the user's closed days (layer 2).
const BUDGET = 9, CAP = { H: 2, M: 3 }, STUCK = 3;
const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const MON = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const today = new Date(); today.setHours(0, 0, 0, 0);
const monIdx = (today.getDay() + 6) % 7;
const dayDate = (d) => { const x = new Date(today); x.setDate(x.getDate() + d); return x; };
const offsetOf = (date) => Math.round((date - today) / 864e5);
const dm = (d) => `${dayDate(d).getDate()}.${String(dayDate(d).getMonth() + 1).padStart(2, '0')}`;
const dayLabel = (d) => d === 0 ? 'Сегодня' : d === 1 ? 'Завтра' : d === -1 ? 'Вчера' : `${DOW[dayDate(d).getDay()]} ${dayDate(d).getDate()}`;

// Quick-capture parser (ru): date/time words are cut out of the title; no date means Inbox.
const WD = { пн: 1, по: 1, вт: 2, ср: 3, чт: 4, че: 4, пт: 5, пя: 5, сб: 6, су: 6, вс: 0, во: 0 };
function parse(text) {
  let t = ` ${text.trim()} `, day = null, time = null, m;
  if ((m = t.match(/\sв\s?(\d{1,2})(?::(\d{2}))?(?=\s)/i)) && +m[1] < 24) { time = `${m[1].padStart(2, '0')}:${m[2] || '00'}`; t = t.replace(m[0], ' '); }
  if ((m = t.match(/\sпослезавтра(?=\s)/i))) { day = 2; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\sзавтра(?=\s)/i))) { day = 1; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\sсегодня(?=\s)/i))) { day = 0; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\sчерез\s(\d{1,2})\sд(?:ень|ня|ней)(?=\s)/i))) { day = +m[1]; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\s(?:в\s|во\s)?(пн|вт|ср|чт|пт|сб|вс|понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье)(?=\s)/i))) {
    const wd = WD[m[1].toLowerCase().slice(0, 2)];
    day = (wd - today.getDay() + 7) % 7 || 7; t = t.replace(m[0], ' ');
  }
  if (time && day === null) day = 0;
  return { title: t.replace(/\s+/g, ' ').trim(), day, time };
}
[['Позвонить маме завтра в 18:00', ['Позвонить маме', 1, '18:00']],
 ['идея про заметки со связями', ['идея про заметки со связями', null, null]],
 ['отчёт через 3 дня', ['отчёт', 3, null]],
 ['купить хлеб в 9', ['купить хлеб', 0, '09:00']]]
  .forEach(([s, e]) => { const r = parse(s); console.assert(JSON.stringify([r.title, r.day, r.time]) === JSON.stringify(e), 'parse', s, r); });

// ---------- mock data ----------
function rng(a) { return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function seed() {
  let id = 0;
  const T = (title, day, w, v, extra = {}) => ({ id: ++id, title, day, w, v, pp: 0, st: 'open', some: false, time: null, doneDay: null, dropDay: null, ...extra });
  const r = rng(7), pick = (a) => a[Math.floor(r() * a.length)];
  const TITLES = { visa: ['Немецкий: урок', 'Справки для ВНЖ', 'Письмо в ведомство'], cash: ['Фича для клиента', 'Счёт клиенту', 'Релиз-заметки'],
    life: ['Тренировка', 'Продукты', 'Врач', 'Уборка'], opt: ['Настроить терминал', 'Сравнить таск-менеджеры', 'Обновить дотфайлы', 'Переставить иконки'] };
  const L = [];
  for (let d = -40; d < 0; d++) { // history: some days drift into "optimisation"
    const skew = r() < 0.3, n = 3 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) {
      const v = skew && r() < 0.7 ? 'opt' : pick(Object.keys(VEC)), ok = r() < 0.85;
      L.push(T(pick(TITLES[v]), d, pick(['H', 'M', 'S', 'S']), v, ok ? { st: 'done', doneDay: d } : { st: 'dropped', dropDay: d }));
    }
  }
  L.push(
    T('Позвонить в банк', -1, 'S', 'life', { pp: 1 }),
    T('Дочитать статью про RAG', -2, 'M', 'opt', { pp: 2 }),
    T('Выпустить PlanWise 0.3', 0, 'H', 'cash'),
    T('Подать документы на ВНЖ: собрать справки', 0, 'H', 'visa', { pp: 3 }),
    T('Ответить в чат по сделке', 0, 'S', 'cash', { time: '12:00' }),
    T('Тренировка', 0, 'M', 'life'),
    T('Купить продукты', 0, 'S', 'life'),
    T('Рефакторинг настроек PlanWise', 0, 'M', 'opt'),
    T('Настроить хоткеи в Obsidian', 0, 'S', 'opt'),
    T('Почистить закладки', 0, 'S', 'opt'),
    T('Курс немецкого: урок 12', 1, 'M', 'visa'),
    T('Счёт клиенту', 2, 'M', 'cash'),
    T('Тренировка', 2, 'M', 'life'),
    T('Созвон с заказчиком', 3, 'S', 'cash', { time: '15:00' }),
    T('Налоговая декларация', 5, 'H', 'cash'),
    T('Дедлайн: анкета на ВНЖ', 9, 'H', 'visa'),
    T('ДР мамы — подарок', 12, 'S', 'life'),
    T('Спланировать отпуск', 20, 'M', 'life'),
    T('идея: заметки со связями между словами', null, null, null),
    T('спросить у Макса про хостинг', null, null, null),
    T('Свой сайт-портфолио', null, 'H', 'cash', { some: true }),
    T('Выучить Rust macros', null, 'M', 'opt', { some: true }),
  );
  return L;
}
const init = () => ({ tasks: seed(), view: 'week', weekOff: 0, monthOff: 0, rev: 'week', focus: false, closed: false, notes: {}, dlg: null, ask: null, msg: '' });

// ---------- state ----------
const KEY = 'pw-proto-w1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch { /* storage unavailable */ }
if (!S || !S.tasks) S = init();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* ignore */ } };
const find = (id) => S.tasks.find((t) => t.id === id);
const newTask = (title, day, extra = {}) => ({ id: Math.max(0, ...S.tasks.map((t) => t.id)) + 1, title, day, time: null, w: null, v: null, st: 'open', pp: 0, some: false, doneDay: null, dropDay: null, ...extra });
const on = (d) => S.tasks.filter((t) => t.day === d && !t.some);
const tails = () => S.tasks.filter((t) => t.st === 'open' && !t.some && t.day !== null && t.day < 0);
const pts = (t) => WT[t.w || 'M'].pts;

// ---------- small views ----------
const seg = (act, items, active) => `<div class="segmented-control">${items.map(([k, n]) => `<button type="button" data-a="${act}" data-id="${k}" class="${k === active ? 'active' : ''}">${n}</button>`).join('')}</div>`;
const wChip = (t) => `<button type="button" class="chip" data-a="cyclew" data-id="${t.id}" title="Вес: ${t.w ? WT[t.w].n : 'не задан'} (клик — сменить)">${t.w || '?'}</button>`;
const vChip = (t) => `<button type="button" class="chip" data-a="cyclev" data-id="${t.id}" title="${t.v ? VEC[t.v].n : 'Без вектора'} (клик — сменить)">${t.v ? VEC[t.v].i : '·'}</button>`;
const ppBadge = (t) => t.pp ? `<span class="chip" title="Переносилась ${t.pp} раз">↻${t.pp}</span>` : '';
const hint = (p) => p.title ? `→ ${p.day === null ? 'Входящие' : dayLabel(p.day)}${p.time ? ', ' + p.time : ''} · «${p.title}»` : 'Без даты — во Входящие';
function taskRow(t, cls = '', extra = '') {
  const live = t.st === 'open';
  return `<div class="task w-${t.w || 'none'} ${cls}" ${live ? 'draggable="true"' : ''} data-id="${t.id}">
    <input type="checkbox" data-a="done" data-id="${t.id}" ${t.st === 'done' ? 'checked' : ''} ${t.st === 'dropped' ? 'disabled' : ''} aria-label="Сделано">
    <span class="t ${live ? '' : 'done'}">${extra}${esc(t.title)}${t.time ? ` <span class="muted">${t.time}</span>` : ''}${t.st === 'dropped' ? ' <span class="muted">· отпущено</span>' : ''}</span>
    <span class="meta">${ppBadge(t)}${live ? wChip(t) + vChip(t) : ''}</span></div>`;
}
const addForm = (where) => `<form class="add" data-f="add" data-where="${where}"><input name="q" placeholder="+ добавить" autocomplete="off" aria-label="Добавить задачу"></form>`;
const stackBar = (c) => {
  const n = Object.values(c).reduce((a, b) => a + b, 0) || 1;
  return `<div class="stack">${Object.keys(VEC).map((k) => c[k] ? `<span style="width:${(c[k] / n) * 100}%;background:${VEC[k].c}" title="${VEC[k].n}: ${c[k]}"></span>` : '').join('')}</div>`;
};
const vecCount = (list) => list.reduce((c, t) => { if (t.v) c[t.v]++; return c; }, { visa: 0, cash: 0, life: 0, opt: 0 });

// ---------- week ----------
function todayCol(focus) {
  const L = on(0), live = L.filter((t) => t.st !== 'dropped');
  const used = live.reduce((a, t) => a + pts(t), 0), H = live.filter((t) => t.w === 'H').length, M = live.filter((t) => t.w === 'M').length;
  const over = used > BUDGET || H > CAP.H || M > CAP.M;
  let h = `<h3><span>Сегодня, ${dm(0)}</span><span class="load ${over ? 'over' : ''}" title="Обычно ты закрываешь ${BUDGET} очков (H=3, M=2, S=1), Heavy не больше ${CAP.H}, Medium не больше ${CAP.M}">${used}/${BUDGET} · H ${H}/${CAP.H} · M ${M}/${CAP.M}</span></h3>`;
  if (S.closed) h += `<div class="closed">✓ День закрыт${S.notes[0] ? ' · ' + esc(S.notes[0]) : ''}</div>`;
  const tl = tails();
  if (tl.length && !S.closed) h += `<button class="btn-ghost tailbar" data-a="dlg" data-id="tails">↩ Хвосты прошлых дней: ${tl.length} — решить</button>`;
  let acc = 0, lined = false, now = false;
  const rows = [], below = [];
  L.forEach((t) => {
    if (t.st !== 'dropped') acc += pts(t);
    const out = acc > BUDGET && t.st === 'open';
    if (out && !lined && !focus) { lined = true; rows.push('<div class="line">черта: обычно ты успеваешь до сюда</div>'); }
    const isNow = !now && !out && t.st === 'open' && !S.closed;
    if (isNow) now = true;
    const html = taskRow(t, (out ? 'below ' : '') + (isNow ? 'now' : ''), isNow ? '<span class="tag">сейчас · </span>' : '');
    (focus && out ? below : rows).push(html);
  });
  h += rows.join('');
  if (below.length) h += `<details><summary>За шторой, ниже черты: ${below.length}</summary>${below.join('')}</details>`;
  if (!L.length) h += '<p class="muted">Пусто. Перетащи сюда задачи из Входящих или с других дней.</p>';
  h += addForm('0');
  if (!S.closed) h += '<button class="btn-primary closebtn" data-a="dlg" data-id="close">Закрыть день</button>';
  return `<div class="col today" data-drop="0">${h}</div>`;
}
function dayCol(d) {
  if (d === 0) return todayCol(false);
  const L = on(d), open = L.filter((t) => t.st === 'open').length;
  return `<div class="col ${d < 0 ? 'past' : ''}" data-drop="${d}"><h3><span>${DOW[dayDate(d).getDay()]}, ${dm(d)}</span><span class="load">${open || ''}</span></h3>
    ${L.map((t) => taskRow(t, '', d < 0 && t.st === 'open' ? '<span class="tag">хвост · </span>' : '')).join('')}${d > 0 ? addForm(String(d)) : ''}</div>`;
}
function weekView() {
  if (S.focus) return `<p class="muted">Фокус: только сегодня, всё ниже черты — за шторой. Чтобы планировать, нажми «Фокус» ещё раз.</p><div class="week" style="grid-template-columns:minmax(0,720px)">${todayCol(true)}</div>`;
  const start = -monIdx + 7 * S.weekOff, days = [...Array(7)].map((_, i) => start + i);
  const cols = days.map((d) => d === 0 ? 'minmax(0,1.7fr)' : 'minmax(0,1fr)').join(' ') + ' minmax(0,1fr)';
  const inbox = S.tasks.filter((t) => t.day === null && !t.some && t.st === 'open'), some = S.tasks.filter((t) => t.some && t.st === 'open');
  return `<div class="nav"><button class="btn-ghost" data-a="wk" data-id="-1" aria-label="Прошлая неделя">‹</button><b>${dm(start)} – ${dm(start + 6)}</b><button class="btn-ghost" data-a="wk" data-id="1" aria-label="Следующая неделя">›</button>${S.weekOff ? '<button class="btn-ghost" data-a="wk" data-id="0">К сегодня</button>' : ''}</div>
    <div class="week" style="grid-template-columns:${cols}">${days.map(dayCol).join('')}
      <div class="side"><div class="box" data-drop="inbox"><h3><span>Входящие</span><span class="load">${inbox.length}</span></h3>${inbox.map((t) => taskRow(t)).join('')}${addForm('inbox')}</div>
      <div class="box" data-drop="some"><h3><span>Когда-нибудь</span><span class="load">${some.length}</span></h3>${some.map((t) => taskRow(t)).join('')}${addForm('some')}</div></div></div>`;
}

// ---------- month ----------
function monthView() {
  const first = new Date(today.getFullYear(), today.getMonth() + S.monthOff, 1), m = first.getMonth(), lead = (first.getDay() + 6) % 7;
  const start = offsetOf(first) - lead, weeks = Math.ceil((lead + new Date(first.getFullYear(), m + 1, 0).getDate()) / 7);
  let h = `<div class="nav"><button class="btn-ghost" data-a="mo" data-id="-1" aria-label="Прошлый месяц">‹</button><b>${MON[m]} ${first.getFullYear()}</b><button class="btn-ghost" data-a="mo" data-id="1" aria-label="Следующий месяц">›</button>${S.monthOff ? '<button class="btn-ghost" data-a="mo" data-id="0">К сегодня</button>' : ''}<span class="muted">Клик по дню — открыть его неделю</span></div><div class="mgrid">`;
  h += ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map((x) => `<div class="mhead">${x}</div>`).join('');
  for (let d = start; d < start + weeks * 7; d++) {
    const L = on(d).filter((t) => t.st !== 'dropped');
    const body = d < 0
      ? (L.length ? `<div class="muted">✓ ${L.filter((t) => t.st === 'done').length}${L.some((t) => t.st === 'open') ? ' · хвост' : ''}</div>` : '')
      : L.slice(0, 3).map((t) => `<div class="it ${t.st === 'done' ? 'done' : ''}">${t.time ? t.time + ' ' : ''}${esc(t.title)}</div>`).join('') + (L.length > 3 ? `<div class="muted">+${L.length - 3}</div>` : '');
    h += `<button type="button" class="mcell ${dayDate(d).getMonth() !== m ? 'out' : ''} ${d === 0 ? 'today' : ''}" data-a="goto" data-id="${d}"><div class="n">${dayDate(d).getDate()}</div>${body}</button>`;
  }
  return h + '</div>';
}

// ---------- review ----------
function reviewView() {
  const span = S.rev === 'week' ? 7 : 35, from = -span + 1;
  const done = S.tasks.filter((t) => t.st === 'done' && t.doneDay !== null && t.doneDay >= from && t.doneDay <= 0);
  const dropped = S.tasks.filter((t) => t.st === 'dropped' && t.dropDay !== null && t.dropDay >= from && t.dropDay <= 0).length;
  const rows = S.rev === 'week'
    ? [...Array(7)].map((_, i) => { const d = from + i; return [dayLabel(d), done.filter((t) => t.doneDay === d)]; })
    : [...Array(5)].map((_, i) => { const a = from + i * 7; return [`${dm(a)} – ${dm(a + 6)}`, done.filter((t) => t.doneDay >= a && t.doneDay <= a + 6)]; });
  const sum = vecCount(done), optShare = Math.round((sum.opt / (done.length || 1)) * 100);
  const zombies = S.tasks.filter((t) => t.st === 'open' && t.pp >= STUCK);
  const noteDays = Object.keys(S.notes).map(Number).filter((d) => d >= from && d <= 0 && S.notes[d]).sort((a, b) => b - a);
  let h = `<div class="bar">${seg('rev', [['week', 'Неделя'], ['month', 'Месяц']], S.rev)}<span class="muted">${S.rev === 'week' ? 'последние 7 дней' : 'последние 5 недель'}</span></div>`;
  h += `<div class="card nums"><div><b>${done.length}</b><span class="muted">сделано</span></div><div><b>${dropped}</b><span class="muted">отпущено</span></div><div><b>${zombies.length}</b><span class="muted">застряло (↻${STUCK}+)</span></div><div><b>${tails().length}</b><span class="muted">хвостов сейчас</span></div></div>`;
  h += `<div class="card"><div class="sec" style="margin-top:0">Куда ушло время</div>${rows.map(([l, L]) => `<div class="wk"><span>${l}</span>${stackBar(vecCount(L))}<span>${L.length}</span></div>`).join('')}
    <div class="legend">${Object.keys(VEC).map((k) => `<span>${VEC[k].i} ${VEC[k].n}: <b>${sum[k]}</b></span>`).join('')}</div>`;
  if (optShare > 40) h += `<div class="alert-banner danger">${optShare}% сделанного — «Оптимизация». Удобная работа вытесняет важную.</div>`;
  if (!sum.visa) h += '<div class="alert-banner danger">За период ни одной задачи «ВНЖ / Учёба».</div>';
  h += '</div>';
  if (zombies.length) h += `<div class="card"><div class="sec" style="margin-top:0">Застрявшие задачи</div>${zombies.map((t) => `<div class="row"><span class="t">${esc(t.title)}</span>${ppBadge(t)}</div>`).join('')}<p><button class="btn-primary" data-a="dlg" data-id="zombies">Решить по ним</button></p></div>`;
  if (noteDays.length) h += `<div class="card"><div class="sec" style="margin-top:0">Заметки дней</div>${noteDays.map((d) => `<p><b>${dayLabel(d)}:</b> ${esc(S.notes[d])}</p>`).join('')}</div>`;
  return h;
}

// ---------- evening close / triage dialog ----------
function dialogView() {
  const mode = S.dlg;
  const list = mode === 'close' ? on(0).filter((t) => t.st === 'open') : mode === 'tails' ? tails() : S.tasks.filter((t) => t.st === 'open' && t.pp >= STUCK);
  const title = { close: 'Закрыть день', tails: 'Хвосты прошлых дней', zombies: 'Застрявшие задачи' }[mode];
  let h = `<h2 style="margin-top:0">${title}</h2>`;
  if (mode === 'close') {
    const done = S.tasks.filter((t) => t.st === 'done' && t.doneDay === 0);
    h += `<p>Сделано сегодня: <b>${done.length}</b>${done.length ? ' — ' + done.map((t) => esc(t.title)).join(', ') : ''}.</p>
      <form class="capture" data-f="unplanned" style="margin-bottom:var(--sp-3)"><input name="q" placeholder="Сделал что-то вне плана? Одной строкой" autocomplete="off"><button class="btn-ghost">Добавить</button></form>
      <div class="sec">Что не успел — реши по каждой (${list.length})</div>`;
  } else h += '<p class="muted">Каждой задаче — одно решение. Ничего не переносится само.</p>';
  if (!list.length) h += '<p class="muted">Решать нечего.</p>';
  list.forEach((t) => {
    const stuck = t.pp >= STUCK, lock = stuck ? `disabled title="Переносилась уже ${t.pp} раза"` : '';
    h += `<div class="row"><span class="t">${esc(t.title)}</span>${ppBadge(t)}
      <button class="btn-ghost" data-a="mv" data-id="${t.id}" data-d="1" ${lock}>Завтра</button>
      <button class="btn-ghost" data-a="mv" data-id="${t.id}" data-d="nw" ${lock}>След. неделя</button>
      <button class="btn-ghost" data-a="mv" data-id="${t.id}" data-d="s">Когда-нибудь</button>
      <button class="${stuck ? 'btn-primary' : 'btn-ghost'}" data-a="split" data-id="${t.id}">Разбить</button>
      <button class="${stuck ? 'btn-danger-outline' : 'btn-ghost'}" data-a="drop" data-id="${t.id}">Отпустить</button>`;
    if (stuck) h += `<div class="stuck">Переносилась ${t.pp} раза — похоже, она слишком большая или уже не нужна. Перенос закрыт: разбей или отпусти.</div>`;
    if (S.ask === t.id) h += `<div class="ask">Первый шаг на 15 минут: <input placeholder="например: найти список справок на сайте" autocomplete="off">
      <button class="btn-primary" data-a="step" data-id="${t.id}">На завтра</button></div>`;
    h += '</div>';
  });
  if (mode === 'close') {
    h += `<div class="sec">Пара слов о дне (необязательно)</div><textarea name="note" placeholder="Это и есть заметка дня">${esc(S.notes[0] || '')}</textarea>
      <p style="display:flex;gap:var(--sp-2)"><button class="btn-primary" data-a="closeday" ${list.length ? 'disabled' : ''}>${list.length ? `Осталось решить: ${list.length}` : 'Закрыть день'}</button><button class="btn-ghost" data-a="dlg" data-id="">Позже</button></p>`;
  } else h += '<p><button class="btn-primary" data-a="dlg" data-id="">Готово</button></p>';
  return `<div class="modal-overlay" data-a="dlgbg"><div class="modal-dialog triage" role="dialog" aria-modal="true" aria-label="${title}">${h}</div></div>`;
}

// ---------- render ----------
function render() {
  let h = `<div class="bar">${seg('view', [['week', 'Неделя'], ['month', 'Месяц'], ['review', 'Обзор']], S.focus ? '' : S.view)}
    <form class="capture" data-f="cap"><input name="q" placeholder="Запиши что угодно: «позвонить маме завтра в 18»" autocomplete="off" aria-label="Быстрая запись"><button class="btn-primary">Записать</button></form></div><div class="hint">Без даты — во Входящие</div>`;
  if (S.msg) h += `<div class="alert-banner info" style="margin-bottom:var(--sp-2)">${esc(S.msg)}</div>`;
  h += S.view === 'week' ? weekView() : S.view === 'month' ? monthView() : reviewView();
  if (S.dlg) h += dialogView();
  $('#app').innerHTML = h;
  $('[data-a=focus]').className = S.focus ? 'btn-primary' : 'btn-ghost';
  save();
}

// ---------- actions ----------
const cycle = (arr, x) => arr[(arr.indexOf(x) + 1) % arr.length];
function postpone(t, day) { // moving an open task off a current/past day to the future counts as a postpone
  const counts = t.day !== null && t.day <= 0 && !t.some && day > 0;
  if (counts && t.pp >= STUCK) { S.msg = `«${t.title}» переносилась ${t.pp} раза — перенос закрыт. Разбей или отпусти: «Закрыть день» или Обзор.`; return false; }
  if (counts) t.pp++;
  Object.assign(t, { day, some: false });
  return true;
}
function moveTo(t, where, beforeId) {
  if (where === 'inbox') Object.assign(t, { day: null, some: false });
  else if (where === 'some') Object.assign(t, { day: null, some: true });
  else if (!postpone(t, Number(where))) return;
  S.tasks.splice(S.tasks.indexOf(t), 1);
  const b = beforeId ? S.tasks.findIndex((x) => x.id === beforeId) : -1;
  if (b >= 0) S.tasks.splice(b, 0, t); else S.tasks.push(t);
}
// self-check: a stuck task cannot be dragged to the future; a fresh one gets ↻1
(() => {
  const keep = S, a = { id: 1, day: 0, some: false, pp: 3 }, b = { id: 2, day: 0, some: false, pp: 0 };
  S = { tasks: [a, b], msg: '' };
  moveTo(a, '2'); moveTo(b, '1');
  console.assert(a.day === 0 && a.pp === 3 && S.msg && b.day === 1 && b.pp === 1, 'postpone rule');
  S = keep;
})();

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, raw = el.dataset.id, id = Number(raw), t = find(id);
  if (a === 'dlgbg' && e.target !== el) return; // click inside the dialog body, not on the backdrop
  S.msg = '';
  switch (a) {
    case 'theme': setTheme(document.documentElement.dataset.theme !== 'dark-slate'); return;
    case 'reset': S = init(); break;
    case 'view': S.view = raw; S.focus = false; break;
    case 'rev': S.rev = raw; break;
    case 'focus': S.focus = !S.focus; S.view = 'week'; S.weekOff = 0; break;
    case 'wk': S.weekOff = id ? S.weekOff + id : 0; break;
    case 'mo': S.monthOff = id ? S.monthOff + id : 0; break;
    case 'goto': S.view = 'week'; S.weekOff = Math.floor((id + monIdx) / 7); break;
    case 'done':
      if (t.st === 'done') Object.assign(t, { st: 'open', doneDay: null });
      else Object.assign(t, { st: 'done', doneDay: 0 });
      break;
    case 'cyclew': t.w = cycle([null, 'S', 'M', 'H'], t.w); break;
    case 'cyclev': t.v = cycle(Object.keys(VEC), t.v); break;
    case 'dlg': S.dlg = raw || null; S.ask = null; break;
    case 'dlgbg': S.dlg = null; S.ask = null; break;
    case 'mv':
      if (el.dataset.d === 's') Object.assign(t, { some: true, day: null });
      else postpone(t, el.dataset.d === 'nw' ? 7 - monIdx : 1);
      S.ask = null; break;
    case 'split': S.ask = S.ask === id ? null : id; break;
    case 'drop': Object.assign(t, { st: 'dropped', dropDay: 0 }); S.ask = null; break;
    case 'step': {
      const inp = el.closest('.ask').querySelector('input'), v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      S.tasks.push(newTask(v, 1, { w: 'S', v: t.v }));
      Object.assign(t, { some: true, day: null }); S.ask = null; break;
    }
    case 'closeday': S.closed = true; S.dlg = null; break;
    case 'nextday': {
      S.tasks.forEach((x) => ['day', 'doneDay', 'dropDay'].forEach((k) => { if (x[k] !== null) x[k] -= 1; }));
      const n = {}; Object.keys(S.notes).forEach((k) => { n[k - 1] = S.notes[k]; });
      Object.assign(S, { notes: n, closed: false, weekOff: 0, monthOff: 0, dlg: null, ask: null }); break;
    }
    default: return;
  }
  render();
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.f, where = f.dataset.where, p = parse(String(new FormData(f).get('q') || ''));
  if (!p.title) return;
  let t;
  if (kind === 'add') t = newTask(p.title, where === 'inbox' || where === 'some' ? null : Number(where), { time: p.time, some: where === 'some' });
  else if (kind === 'unplanned') t = newTask(p.title, 0, { st: 'done', doneDay: 0 });
  else t = newTask(p.title, p.day, { time: p.time });
  S.tasks.push(t);
  render();
  const inp = document.querySelector(`form[data-f="${kind}"]${where ? `[data-where="${where}"]` : ''} input[name=q]`);
  if (inp) inp.focus();
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.name === 'note') { S.notes[0] = el.value; save(); return; }
  const f = el.closest('form');
  if (el.name === 'q' && f && f.dataset.f === 'cap') $('.hint').textContent = hint(parse(el.value));
});

// drag & drop between days, Inbox and Someday (mouse only in this prototype)
let dragId = null;
const unhot = () => document.querySelectorAll('.hot').forEach((x) => x.classList.remove('hot'));
document.addEventListener('dragstart', (e) => { const r = e.target.closest && e.target.closest('.task[draggable]'); if (r) { dragId = Number(r.dataset.id); e.dataTransfer.setData('text/plain', String(dragId)); } });
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && dragId) { e.preventDefault(); unhot(); z.classList.add('hot'); } });
document.addEventListener('drop', (e) => {
  const z = e.target.closest && e.target.closest('[data-drop]'), t = find(dragId);
  if (!z || !t) return;
  e.preventDefault();
  const before = e.target.closest('.task');
  S.msg = '';
  moveTo(t, z.dataset.drop, before && Number(before.dataset.id) !== t.id ? Number(before.dataset.id) : null);
  dragId = null; render();
});
document.addEventListener('dragend', () => { dragId = null; unhot(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.dlg) { S.dlg = null; S.ask = null; render(); } });

function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark-slate' : 'light-slate';
  try { localStorage.setItem('pw-proto-theme', dark ? '1' : '0'); } catch { /* ignore */ }
}
let savedTheme = null;
try { savedTheme = localStorage.getItem('pw-proto-theme'); } catch { /* ignore */ }
setTheme(savedTheme === null ? matchMedia('(prefers-color-scheme: dark)').matches : savedTheme === '1');
render();
</script>
</body>
</html>
