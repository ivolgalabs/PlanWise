<!doctype html>
<html lang="ru" data-theme="light-slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanWise — день</title>
<!-- Throwaway prototype of the day cycle (variant E) on mock data. Not part of the app build. A-D variants: commit 73d2912. -->
<link rel="stylesheet" href="../../../../General/UI/Universal%20UI/all.css">
<style>
  body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-ui); font-size: var(--fs-base); }
  button { font-family: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: var(--sp-4); box-sizing: border-box; }
  .top { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
  .top h1 { font-size: var(--fs-lg); margin: 0; }
  .card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--sp-3); margin-bottom: var(--sp-3); }
  .bar { margin-bottom: var(--sp-3); }
  .row { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2); border-radius: var(--radius-md); flex-wrap: wrap; }
  .row:hover { background: var(--bg-hover); }
  .row .t { flex: 1; min-width: 160px; }
  .t.done { text-decoration: line-through; color: var(--text-muted); }
  .dim { opacity: 0.45; }
  .muted { color: var(--text-muted); font-size: var(--fs-sm); }
  .line { border-top: 2px dashed var(--warning); margin: var(--sp-2) 0; padding-top: var(--sp-1); font-size: var(--fs-xs); color: var(--warning); }
  .capture { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-1); align-items: center; }
  .capture input[name=q] { flex: 1; min-width: 200px; }
  input:not([type]), textarea { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--pad-control-y) var(--pad-control-x); font: inherit; box-sizing: border-box; }
  textarea { width: 100%; min-height: 60px; }
  .hint { font-size: var(--fs-xs); color: var(--text-muted); min-height: 1.3em; margin-bottom: var(--sp-3); }
  .sec { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: var(--sp-4) 0 var(--sp-1); }
  .chip { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-xs); padding: 2px var(--sp-2); border-radius: var(--radius-full); border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-secondary); cursor: pointer; font-family: inherit; }
  .w-H { border-left: 3px solid var(--danger); }
  .w-M { border-left: 3px solid var(--warning); }
  .w-S { border-left: 3px solid var(--success); }
  .now { padding: var(--sp-5); text-align: center; border: 2px dashed var(--border-color); border-radius: var(--radius-xl); margin-bottom: var(--sp-3); }
  .now .big { font-size: var(--fs-xl); font-weight: 600; margin-bottom: var(--sp-2); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-2); }
  .slot { min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-3); background: var(--bg-secondary); border: 2px solid var(--accent); border-radius: var(--radius-xl); padding: var(--sp-4); }
  .slot.main { background: var(--accent-glow); }
  .slot .big { font-size: var(--fs-md); font-weight: 600; }
  .micro .row { padding: var(--sp-1) var(--sp-2); }
  .stuck { width: 100%; font-size: var(--fs-xs); color: var(--warning); }
  .ask { width: 100%; display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; padding: var(--sp-2); border: 1px solid var(--warning); border-radius: var(--radius-md); }
  .ask input { flex: 1; min-width: 180px; }
  .stack { display: flex; height: 14px; border-radius: var(--radius-full); overflow: hidden; background: var(--bg-tertiary); margin: var(--sp-1) 0; }
  .stack span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: var(--sp-2); }
  .wk { display: grid; grid-template-columns: 70px 1fr 24px; gap: var(--sp-2); align-items: center; font-size: var(--fs-xs); color: var(--text-secondary); }
  .wk .stack { height: 10px; }
  details summary { cursor: pointer; color: var(--text-secondary); font-size: var(--fs-sm); padding: var(--sp-2) 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>PlanWise — день</h1>
    <div>
      <button class="btn-ghost" data-a="theme">Тема</button>
      <button class="btn-ghost" data-a="reset">Сбросить демо</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const VEC = {
  visa: { i: '🎓', n: 'ВНЖ / Учёба', c: 'var(--chart-1)' },
  cash: { i: '💰', n: 'Кэш / Релиз', c: 'var(--chart-2)' },
  life: { i: '🌿', n: 'Здоровье / Быт', c: 'var(--chart-3)' },
  opt: { i: '⚙️', n: 'Оптимизация', c: 'var(--warning)' },
};
const WT = { H: { n: 'Heavy', pts: 3 }, M: { n: 'Medium', pts: 2 }, S: { n: 'Micro', pts: 1 } };
// shortcut: budget, caps and past-week history are mock constants; the real app learns them from history (layer 2).
const BUDGET = 9, CAP_H = 2, CAP_M = 3, SLOTS = 3, STUCK = 3;
const HIST = [{ opt: 4, cash: 0, visa: 0, life: 2 }, { opt: 1, cash: 2, visa: 1, life: 1 }, { opt: 3, cash: 1, visa: 0, life: 1 },
  { opt: 0, cash: 3, visa: 2, life: 1 }, { opt: 5, cash: 0, visa: 0, life: 0 }, { opt: 2, cash: 1, visa: 1, life: 2 }];
const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const today = new Date(); today.setHours(0, 0, 0, 0);
const dayDate = (d) => new Date(today.getTime() + d * 864e5);
const dayLabel = (d) => d === 0 ? 'Сегодня' : d === 1 ? 'Завтра' : d === -1 ? 'Вчера' : `${DOW[dayDate(d).getDay()]} ${dayDate(d).getDate()}`;

// Quick-capture parser (ru): date/time words are cut out of the title; no date means Inbox.
const WD = { пн: 1, по: 1, вт: 2, ср: 3, чт: 4, че: 4, пт: 5, пя: 5, сб: 6, су: 6, вс: 0, во: 0 };
function parse(text) {
  let t = ` ${text.trim()} `, day = null, time = null, m;
  if ((m = t.match(/\sв\s?(\d{1,2})(?::(\d{2}))?(?=\s)/i)) && +m[1] < 24) { time = `${m[1].padStart(2, '0')}:${m[2] || '00'}`; t = t.replace(m[0], ' '); }
  if ((m = t.match(/\sпослезавтра(?=\s)/i))) { day = 2; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\sзавтра(?=\s)/i))) { day = 1; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\sсегодня(?=\s)/i))) { day = 0; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\sчерез\s(\d{1,2})\sд(?:ень|ня|ней)(?=\s)/i))) { day = +m[1]; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\s(?:в\s|во\s)?(пн|вт|ср|чт|пт|сб|вс|понедельник|вторник|среду|среда|четверг|пятницу|пятница|субботу|суббота|воскресенье)(?=\s)/i))) {
    const wd = WD[m[1].toLowerCase().slice(0, 2)];
    day = (wd - today.getDay() + 7) % 7 || 7; t = t.replace(m[0], ' ');
  }
  if (time && day === null) day = 0;
  return { title: t.replace(/\s+/g, ' ').trim(), day, time };
}
[['Позвонить маме завтра в 18:00', ['Позвонить маме', 1, '18:00']],
 ['идея про заметки со связями', ['идея про заметки со связями', null, null]],
 ['отчёт через 3 дня', ['отчёт', 3, null]],
 ['купить хлеб в 9', ['купить хлеб', 0, '09:00']]]
  .forEach(([s, e]) => { const r = parse(s); console.assert(JSON.stringify([r.title, r.day, r.time]) === JSON.stringify(e), 'parse', s, r); });

function seed() {
  const T = (id, title, day, w, v, pp = 0, extra = {}) => ({ id, title, day, w, v, pp, st: 'open', some: false, time: null, ...extra });
  return [
    T(1, 'Подать документы на ВНЖ: собрать справки', 0, 'H', 'visa', 3),
    T(2, 'Выпустить PlanWise 0.3', 0, 'H', 'cash'),
    T(3, 'Рефакторинг настроек PlanWise', 0, 'M', 'opt'),
    T(4, 'Купить продукты', 0, 'S', 'life'),
    T(5, 'Ответить в чат по сделке', 0, 'S', 'cash', 0, { time: '12:00' }),
    T(6, 'Тренировка', 0, 'M', 'life'),
    T(7, 'Настроить хоткеи в Obsidian', 0, 'S', 'opt'),
    T(8, 'Почистить закладки', 0, 'S', 'opt'),
    T(9, 'Позвонить в банк', -1, 'S', 'life', 1),
    T(10, 'Дочитать статью про RAG', -2, 'M', 'opt', 2),
    T(11, 'Курс немецкого: урок 12', 1, 'M', 'visa'),
    T(12, 'Счёт клиенту', 2, 'M', 'cash'),
    T(13, 'идея: заметки со связями между словами', null, null, null),
    T(14, 'спросить у Макса про хостинг', null, null, null),
    T(15, 'Свой сайт-портфолио', null, 'H', 'cash', 0, { some: true }),
  ];
}
const init = () => ({ tasks: seed(), phase: 'morning', picked: [], main: null, note: '', ask: null, moved: 0, pickedCount: 0 });

// ---------- state ----------
const KEY = 'pw-proto-e1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch { /* storage unavailable */ }
if (!S || !S.tasks) S = init();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* ignore */ } };
const find = (id) => S.tasks.find((t) => t.id === id);
const newTask = (title, day, extra = {}) => ({ id: Math.max(0, ...S.tasks.map((t) => t.id)) + 1, title, day, time: null, w: null, v: null, st: 'open', pp: 0, some: false, ...extra });
const picked = () => S.picked.map(find).filter(Boolean);
const isBig = (t) => t.w !== 'S'; // unweighted counts as Medium

// ---------- view helpers ----------
const seg = (act, items, active) => `<div class="segmented-control">${items.map(([k, n]) => `<button type="button" data-a="${act}" data-id="${k}" class="${k === active ? 'active' : ''}">${n}</button>`).join('')}</div>`;
const wChip = (t, click) => `<${click ? 'button type="button"' : 'span'} class="chip w-${t.w || 'none'}" ${click ? `data-a="cyclew" data-id="${t.id}"` : ''}>${t.w ? WT[t.w].n : 'вес?'}</${click ? 'button' : 'span'}>`;
const vChip = (t, click) => `<${click ? 'button type="button"' : 'span'} class="chip" title="${t.v ? VEC[t.v].n : 'без вектора'}" ${click ? `data-a="cyclev" data-id="${t.id}"` : ''}>${t.v ? VEC[t.v].i : '·'}</${click ? 'button' : 'span'}>`;
const ppBadge = (t) => t.pp ? `<span class="chip" title="Сколько раз переносилась">↻${t.pp}</span>` : '';
const timeTag = (t) => t.time ? `<span class="muted">${t.time}</span>` : '';
const hint = (p) => p.title ? `→ ${p.day === null ? 'Входящие' : dayLabel(p.day)}${p.time ? ', ' + p.time : ''} · «${p.title}»` : 'Без даты — во Входящие';
const stackBar = (c) => {
  const n = Object.values(c).reduce((a, b) => a + b, 0) || 1;
  return `<div class="stack">${Object.keys(VEC).map((k) => c[k] ? `<span style="width:${(c[k] / n) * 100}%;background:${VEC[k].c}" title="${VEC[k].n}: ${c[k]}"></span>` : '').join('')}</div>`;
};
function vecCount(list) {
  const c = { visa: 0, cash: 0, life: 0, opt: 0 };
  list.forEach((t) => { if (t.v) c[t.v]++; });
  return c;
}
function dayVectors(done) {
  const c = vecCount(done);
  return stackBar(c) + `<div class="legend">${Object.keys(VEC).map((k) => `<span>${VEC[k].i} ${VEC[k].n}: <b>${c[k]}</b></span>`).join('')}</div>`
    + (c.opt >= 3 && c.visa + c.cash === 0
      ? `<div class="alert-banner danger">День ушёл в «Оптимизацию»: ${c.opt} задачи, а на ВНЖ/Учёбу и Кэш — ноль. Похоже на прокрастинацию с продуктивным лицом.</div>` : '');
}
function weekRadar(done) {
  const days = HIST.map((c, i) => ({ c, d: i - HIST.length })).concat([{ c: vecCount(done), d: 0 }]);
  const sum = { visa: 0, cash: 0, life: 0, opt: 0 };
  days.forEach(({ c }) => Object.keys(sum).forEach((k) => { sum[k] += c[k]; }));
  const total = Object.values(sum).reduce((a, b) => a + b, 0) || 1;
  const warn = sum.opt / total > 0.4
    ? `<div class="alert-banner danger">За неделю ${Math.round((sum.opt / total) * 100)}% сделанного — «Оптимизация». Перекос держится не один день.</div>` : '';
  return `<div class="card">${days.map(({ c, d }) => `<div class="wk"><span>${dayLabel(d)}</span>${stackBar(c)}<span>${Object.values(c).reduce((a, b) => a + b, 0)}</span></div>`).join('')}
    <div class="legend" style="margin-top:var(--sp-2)">${Object.keys(VEC).map((k) => `<span>${VEC[k].i} ${sum[k]}</span>`).join('')}<span class="muted">прошлые дни — пример</span></div>${warn}</div>`;
}

// ---------- views ----------
function render() {
  const P = picked();
  let h = `<div class="bar">${seg('phase', [['morning', '1 · Утро: собрать'], ['day', '2 · День'], ['evening', '3 · Вечер: закрыть']], S.phase === 'closed' ? 'evening' : S.phase)}</div>`;
  if (S.phase === 'closed') h += closedView();
  else {
    h += `<form class="capture" data-f="cap"><input name="q" placeholder="Запиши что угодно: «позвонить маме завтра в 18»" autocomplete="off"><button class="btn-primary">Записать</button></form><div class="hint">Без даты — во Входящие</div>`;
    h += S.phase === 'morning' ? morningView(P) : S.phase === 'day' ? dayView(P) : eveningView(P);
  }
  $('#app').innerHTML = h;
  save();
}
function pickRow(t, isPicked) {
  return `<div class="row w-${t.w || 'none'}">
    <input type="checkbox" data-a="pick" data-id="${t.id}" ${isPicked ? 'checked' : ''} aria-label="Взять в день">
    <span class="t">${esc(t.title)} ${timeTag(t)}</span>${ppBadge(t)}${wChip(t, true)}${vChip(t, true)}
    <button type="button" class="btn-ghost" data-a="main" data-id="${t.id}" title="Главное на сегодня">${S.main === t.id ? '★' : '☆'}</button></div>`;
}
function morningView(P) {
  const pts = P.reduce((a, t) => a + WT[t.w || 'M'].pts, 0), H = P.filter((t) => t.w === 'H').length, M = P.filter((t) => t.w === 'M').length;
  let h = `<div class="card">Очки <b>${pts}/${BUDGET}</b> (обычно закрываешь столько) · Heavy <b>${H}/${CAP_H}</b> · Medium <b>${M}/${CAP_M}</b> · Micro без лимита`;
  const over = [pts > BUDGET && `очков ${pts} из ${BUDGET}`, H > CAP_H && `Heavy ${H} из ${CAP_H}`, M > CAP_M && `Medium ${M} из ${CAP_M}`].filter(Boolean);
  if (over.length) h += `<div class="alert-banner danger" style="margin:var(--sp-2) 0 0">Перегруз: ${over.join(', ')}. Начать можно, но что-то из этого, скорее всего, уедет на завтра.</div>`;
  h += '</div><div class="sec">Твой день</div>';
  if (!P.length) h += '<p class="muted">Отметь задачи ниже. ★ — главное: если день сломается, его не жертвуем. Вес и вектор — кликом по меткам.</p>';
  let acc = 0, lined = false;
  P.forEach((t) => {
    const out = (acc += WT[t.w || 'M'].pts) > BUDGET;
    if (out && !lined) { h += '<div class="line">черта: ниже — вряд ли сегодня</div>'; lined = true; }
    h += `<div class="${out ? 'dim' : ''}">${pickRow(t, true)}</div>`;
  });
  const free = S.tasks.filter((t) => t.st === 'open' && !t.some && !S.picked.includes(t.id));
  [['Хвосты прошлых дней', (t) => t.day !== null && t.day < 0], ['Запланировано на сегодня', (t) => t.day === 0], ['Входящие', (t) => t.day === null]]
    .forEach(([title, f]) => {
      const L = free.filter(f);
      if (L.length) h += `<div class="sec">${title} (${L.length})</div>${L.map((t) => pickRow(t, false)).join('')}`;
    });
  return h + `<p><button class="btn-primary" data-a="phase" data-id="day" ${P.length ? '' : 'disabled'}>Начать день →</button></p>`;
}
function dayView(P) {
  if (!P.length) {
    return `<div class="now"><div class="big">День ещё не собран</div><p class="muted">Утром выбери, что реально успеешь, — здесь будут только эти задачи.</p>
      <button class="btn-primary" data-a="phase" data-id="morning">← 1 · Утро: собрать</button></div>`;
  }
  const open = P.filter((t) => t.st === 'open'), cards = open.filter(isBig), micro = P.filter((t) => !isBig(t));
  let h = '';
  if (!open.length) h += '<div class="now"><div class="big">Всё выбранное сделано</div><button class="btn-primary" data-a="phase" data-id="evening">Закрыть день</button></div>';
  else if (cards.length) {
    h += '<div class="slots">' + cards.slice(0, SLOTS).map((t) => `<div class="slot ${t.id === S.main ? 'main' : ''}">
      <div><div class="muted">${t.id === S.main ? '★ главное' : '&nbsp;'}</div><div class="big">${esc(t.title)}</div></div>
      <div>${wChip(t, false)} ${vChip(t, false)} ${timeTag(t)}</div>
      <div class="actions"><button class="btn-primary" data-a="done" data-id="${t.id}">Сделано</button><button class="btn-ghost" data-a="skip" data-id="${t.id}">Потом</button></div></div>`).join('') + '</div>';
    if (cards.length > SLOTS) h += `<p class="muted">Ещё ${cards.length - SLOTS} в очереди — появятся, когда освободится карточка.</p>`;
  }
  if (micro.length) {
    h += `<div class="sec">Мелочи · ${micro.filter((t) => t.st === 'done').length}/${micro.length}</div><div class="card micro">${micro.map((t) => `<div class="row">
      <input type="checkbox" data-a="done" data-id="${t.id}" ${t.st === 'done' ? 'checked' : ''}><span class="t ${t.st === 'done' ? 'done' : ''}">${esc(t.title)} ${timeTag(t)}</span>${vChip(t, false)}</div>`).join('')}</div>`;
  }
  const doneBig = P.filter((t) => isBig(t) && t.st === 'done');
  if (doneBig.length) h += `<div class="sec">Сделано (${doneBig.length})</div>${doneBig.map((t) => `<div class="row"><span class="t done">${esc(t.title)}</span></div>`).join('')}`;
  const hidden = S.tasks.filter((t) => t.st === 'open' && !S.picked.includes(t.id));
  h += `<details><summary>За шторой ${hidden.length} задач — приоткрыть</summary>${hidden.map((t) => `<div class="row dim"><span class="t">${esc(t.title)}</span><span class="muted">${t.some ? 'когда-нибудь' : t.day === null ? 'входящие' : dayLabel(t.day)}</span></div>`).join('')}</details>`;
  return h + '<p><button class="btn-ghost" data-a="phase" data-id="evening">Вечер: закрыть день →</button></p>';
}
function eveningView(P) {
  const done = S.tasks.filter((t) => t.st === 'done' && t.doneToday), tl = P.filter((t) => t.st === 'open');
  let h = `<div class="sec">Сделано (${done.length})</div>${done.map((t) => `<div class="row"><span class="t">✓ ${esc(t.title)}</span>${vChip(t, false)}</div>`).join('') || '<p class="muted">Пока ничего — и это тоже честный итог.</p>'}`;
  h += '<form class="capture" data-f="unplanned"><input name="q" placeholder="Сделал вне плана? Одной строкой" autocomplete="off"><button class="btn-ghost">Добавить в сделанное</button></form>';
  h += `<div class="sec">Куда ушёл день</div>${dayVectors(done)}`;
  h += `<div class="sec">Куда ушла неделя</div>${weekRadar(done)}`;
  h += `<div class="sec">Решить по хвостам дня (${tl.length})</div><p class="muted">Только то, что ты брал в день. Задачи за шторой вечером не трогаем.</p>`;
  if (!tl.length) h += '<p class="muted">Хвостов нет.</p>';
  tl.forEach((t) => {
    const stuck = t.pp >= STUCK;
    const lock = stuck ? `disabled title="Переносилась ${t.pp} раза — разбей или отпусти"` : '';
    h += `<div class="row w-${t.w || 'none'}"><span class="t">${esc(t.title)}</span>${ppBadge(t)}
      <button class="btn-ghost" data-a="mv" data-id="${t.id}" data-d="1" ${lock}>Завтра</button>
      <button class="btn-ghost" data-a="mv" data-id="${t.id}" data-d="w" ${lock}>На неделе</button>
      <button class="btn-ghost" data-a="mv" data-id="${t.id}" data-d="s">Когда-нибудь</button>
      <button class="${stuck ? 'btn-primary' : 'btn-ghost'}" data-a="split" data-id="${t.id}">Разбить на части</button>
      <button class="${stuck ? 'btn-danger-outline' : 'btn-ghost'}" data-a="drop" data-id="${t.id}">Отпустить</button>`;
    if (stuck) h += `<div class="stuck">Переносилась ${t.pp} раза — похоже, задача слишком большая или уже не нужна. «Завтра» закрыто: разбей или отпусти.</div>`;
    if (S.ask === t.id) h += `<div class="ask">Какой первый шаг на 15 минут?
      <input placeholder="например: найти список справок на сайте" autocomplete="off">
      <button class="btn-primary" data-a="step" data-id="${t.id}">Сделать первым шагом на завтра</button>
      <button class="btn-ghost" data-a="cancelAsk">Отмена</button></div>`;
    h += '</div>';
  });
  h += `<div class="sec">Как прошёл день (необязательно)</div><textarea name="note" placeholder="Пара слов — это и есть заметка дня">${esc(S.note)}</textarea>`;
  return h + `<p><button class="btn-primary" data-a="close" ${tl.length ? 'disabled' : ''}>${tl.length ? `Закрыть день (осталось решить: ${tl.length})` : 'Закрыть день'}</button></p>`;
}
function closedView() {
  const done = S.tasks.filter((t) => t.st === 'done' && t.doneToday), dropped = S.tasks.filter((t) => t.dropToday).length;
  let h = `<div class="card"><p><b>День закрыт.</b></p>
    <p>Сделано <b>${done.length}</b> (утром выбрано ${S.pickedCount}) · перенесено ${S.moved} · отпущено ${dropped}. Все хвосты дня получили решение — голове больше нечего держать.</p>`;
  if (S.note) h += `<p class="muted">Заметка дня: ${esc(S.note)}</p>`;
  return h + dayVectors(done) + '<button class="btn-primary" data-a="nextday">Следующий день (демо) →</button></div>';
}

// ---------- actions ----------
function unpick(id) { S.picked = S.picked.filter((x) => x !== id); if (S.main === id) S.main = null; }
function moveTail(t, d) {
  if (d !== 's' && t.pp >= STUCK) return; // postponing a stuck task is blocked, see eveningView
  if (d === 's') { t.some = true; t.day = null; } else { t.day = d === 'w' ? 3 : 1; t.pp++; }
  S.moved++; S.ask = null; unpick(t.id);
}
const cycle = (arr, x) => arr[(arr.indexOf(x) + 1) % arr.length];

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, raw = el.dataset.id, id = Number(raw), t = find(id);
  switch (a) {
    case 'theme': setTheme(document.documentElement.dataset.theme !== 'dark-slate'); return;
    case 'reset': S = init(); break;
    case 'phase':
      if (raw === 'day' && S.phase === 'morning') {
        if (S.main) S.picked = [S.main, ...S.picked.filter((x) => x !== S.main)];
        S.pickedCount = S.picked.length;
      }
      S.phase = raw; break;
    case 'pick': if (S.picked.includes(id)) unpick(id); else S.picked.push(id); break;
    case 'main': S.main = S.main === id ? null : id; if (!S.picked.includes(id)) S.picked.push(id); break;
    case 'done': t.st = t.st === 'done' ? 'open' : 'done'; t.doneToday = t.st === 'done'; break;
    case 'skip': S.picked = S.picked.filter((x) => x !== id).concat(id); break;
    case 'mv': moveTail(t, el.dataset.d); break;
    case 'split': S.ask = S.ask === id ? null : id; break;
    case 'cancelAsk': S.ask = null; break;
    case 'drop': t.st = 'dropped'; t.dropToday = true; S.ask = null; unpick(id); break;
    case 'step': {
      const inp = el.closest('.ask').querySelector('input'), v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      S.tasks.push(newTask(v, 1, { w: 'S', v: t.v }));
      t.some = true; t.day = null; S.ask = null; S.moved++; unpick(id); break;
    }
    case 'close': S.phase = 'closed'; break;
    case 'nextday':
      S.tasks.forEach((x) => { if (x.day !== null) x.day -= 1; x.doneToday = false; x.dropToday = false; });
      Object.assign(S, { phase: 'morning', picked: [], main: null, note: '', ask: null, moved: 0, pickedCount: 0 }); break;
    case 'cyclew': t.w = cycle([null, 'S', 'M', 'H'], t.w); break;
    case 'cyclev': t.v = cycle(Object.keys(VEC), t.v); break;
    default: return;
  }
  render();
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.f, p = parse(String(new FormData(f).get('q') || ''));
  if (!p.title) return;
  const t = newTask(p.title, p.day, { time: p.time });
  if (kind === 'unplanned') Object.assign(t, { day: 0, st: 'done', doneToday: true });
  S.tasks.push(t);
  render();
  const inp = document.querySelector(`form[data-f="${kind}"] input[name=q]`);
  if (inp) inp.focus();
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.name === 'note') { S.note = el.value; save(); return; }
  const f = el.closest('form');
  if (el.name === 'q' && f && f.dataset.f === 'cap') f.nextElementSibling.textContent = hint(parse(el.value));
});

function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark-slate' : 'light-slate';
  try { localStorage.setItem('pw-proto-theme', dark ? '1' : '0'); } catch { /* ignore */ }
}
let savedTheme = null;
try { savedTheme = localStorage.getItem('pw-proto-theme'); } catch { /* ignore */ }
setTheme(savedTheme === null ? matchMedia('(prefers-color-scheme: dark)').matches : savedTheme === '1');
render();
</script>
</body>
</html>
