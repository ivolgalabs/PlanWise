[package]
name = "daily-planner"
version = "0.1.13"
description = "Ежедневник — минималистичный планировщик задач (tweek.so-style)"
authors = ["zkproject"]
edition = "2021"
# Приложение не публикуется (нужно для cargo-deny: private = ignore).
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daily_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Релизный профиль: без strip/LTO библиотека весила ~15 МБ на ABI.
# strip — выкидывает отладочные символы; lto+codegen-units=1 — сквозная
# оптимизация; opt-level="z" — размер вместо скорости (для планировщика
# скорость не критична, а APK на телефоне ощутимо худеет).
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Общая база: диагностика падений (отчёт с backtrace и хвостом журнала).
core_base = { path = "../../../../Modules/core_base", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Тип времени для Schedule::At уведомлений — нужен только на Android
# (тот же crate, что у плагина).
[target.'cfg(target_os = "android")'.dependencies]
time = "0.3"

