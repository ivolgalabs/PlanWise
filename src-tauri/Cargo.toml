[package]
name = "daily-planner"
version = "0.1.0"
description = "Ежедневник — минималистичный планировщик задач (tweek.so-style)"
authors = ["zkproject"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daily_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Общая библиотека воркспейса: fs для ensure_dir (вместо ручного std::fs).
core_base = { path = "../../../Rust_Workspace/core_base", default-features = false, features = ["fs"] }
tauri-plugin-dialog = "2"

